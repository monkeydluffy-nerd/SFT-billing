  <circle cx="815" cy="26" r="7" fill="#14304D"/><text x="815" y="46" font-size="9" fill="#6B7280" text-anchor="middle">Navy</text>
  <circle cx="860" cy="26" r="7" fill="#1D6E8A"/><text x="860" y="46" font-size="9" fill="#6B7280" text-anchor="middle">Teal</text>

  <rect x="20" y="70" width="290" height="310" fill="none" stroke="#E5E7EB"/>
