    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <g fill="#F7F4EE" fill-opacity=".04"><rect width="48" height="1"/><rect width="1" height="48"/></g>
    </pattern>
  </defs>
  <rect width="662" height="900" fill="url(#forest)"/>
